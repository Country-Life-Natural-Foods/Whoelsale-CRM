# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e33dee3eb5ba764d24d3064d6a070c11"
name = "Wholesale CRM"
application_url = "https://shopify-staff-assignment-app-pi.vercel.app"
embedded = true

# Sidekick reads Wholesale CRM data through extensions/wholesale-crm-tools.
[sidekick]
extensions_summary = "Wholesale CRM for Country Life's B2B accounts: assigned sales reps, CRM notes, sample boxes, last-order follow-ups and account buying history."

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "orders/cancelled", "refunds/create"]
uri = "/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_companies,read_customers,read_orders,read_all_orders,write_companies,write_customers,read_metaobjects,write_metaobjects"
# Shopify-managed install (required for Sidekick). The Sidekick endpoints use
# token exchange; the embedded UI's /auth routes stay as a fallback.
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-staff-assignment-app-pi.vercel.app/auth/callback",
  "https://shopify-staff-assignment-app-pi.vercel.app/auth/shopify/callback"
]

[pos]
embedded = false

# PIN-protected leadership accounts for Reports / Staff. PIN hashes stay app-owned.
[metaobjects.app.app_user]
name = "App User"
description = "Leadership accounts that can open Reports with a PIN"
display_name_field = "name"

[metaobjects.app.app_user.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.app_user.fields.pin_hash]
name = "PIN hash"
type = "single_line_text_field"
required = true

[metaobjects.app.app_user.fields.is_admin]
name = "Admin"
type = "boolean"
required = true
